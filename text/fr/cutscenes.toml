# Cutscene text drawn as sprites (tools/cutscene_text.py): each frame becomes 16x16 S-DD1 cels of the French lines,
# centred where the Japanese frame was. `entry` is the sprite-list word that points at the frame (bank CC).
# style "subtitle": gothic, colours 11 (ground) to 15; "credit": serif, colours 0 (clear) to 3. align = "left" / "right":
# on the Japanese frame's left or right edge, as the names under the job titles.

[[frame]]
at = 0xCC2C4E
entry = 0xCC090F
style = "credit"
jp = "ENIX presents"
text = ["ENIX", "présente"]

