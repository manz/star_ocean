# Credit titles on BG3 (C2:DB33): 256x16 2bpp streams named by the credits script at C2:DA57 (op 02 = title,
# 03 = name). `pointers` are the script operands; `align` keeps the Japanese edge (left x or right x).

[[title]]
at = 0xFDCDF5
pointers = [0xC2DA5A, 0xC2DA6A]
align = "right"
text = "Avec"

[[title]]
