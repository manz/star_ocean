# Narration screens (tools/narration.py): pre-rendered 208x64 pictures, four 16-px lines each.
# `text` lines go one per `step` px from the `baseline` of the first; a line starting with ">" is right-aligned,
# otherwise lines are centred (`align = "left"` for the letter). Screen 0 is drawn over its parchment.

[[screen]]  # Kurt village chief's letter: 至急、救援を送られたし。クール村にて / 奇病発生。高熱に悩まされている。/ クール村村長
