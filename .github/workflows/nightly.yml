name: Nightly

on:
  push:
    branches:
      - master

concurrency:
  group: nightly

jobs:
  nightly:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - uses: manz/a816/actions/setup@v1.2.0
    - uses: manz/a816/actions/decrypt-rom@v1.2.0
      with:
        passphrase: ${{ secrets.ROM_PASSPHRASE }}
        encrypted: so.sfc.gz.gpg
        to: Star Ocean (Japan).sfc
        sha1: a616ee3466256482bc0adc11f1fda7c30e66ef8d
    - name: Build patch
      run: uv run python -m tools.patch
    - uses: manz/a816/actions/seal@v1.2.0
      with:
        rom: Star Ocean (Japan).sfc
        patches: build/star_ocean.ips
    - name: Name patch
      run: |
        mkdir -p dist
        cp build/star_ocean.ips dist/star_ocean-fr.ips
    - uses: manz/a816/actions/nightly@v1.2.0
      with:
        files: dist/star_ocean-fr.ips
