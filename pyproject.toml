# Dependency + build configuration for the patch tooling.
#
# This repository builds a ROM patch rather than a library: nothing here is
# imported from outside, so `uv sync` exists to pull the locked dependencies.
[project]
name = "star-ocean"
version = "0.0.0"
description = "Star Ocean translation patch"
authors = [{ name = "Emmanuel Peralta", email = "manz@ringum.net" }]
requires-python = ">=3.14"

dependencies = [
    "a816",
    "katsuji==0.2.3",
]

[dependency-groups]
# RE / asset tooling. kintsuki comes from the local checkout until its S-DD1 API ships.
dev = ["pytest", "pillow", "kintsuki", "mypy", "ruff"]

[tool.uv.sources]
kintsuki = { path = "../../PyCharmProjects/snes/python", editable = true }
# S-DD1 board masks (a816 branch sdd1-board-masks) until the next a816 release.
a816 = { path = "/private/tmp/claude-501/-Users-manz-Projects-star-ocean/846a70bd-6509-49d8-bbf3-d772657af6c9/scratchpad/a816-sdd1", editable = true }

[tool.uv]
package = false
# kintsuki and a816 read their version from $VERSION (set by their CI).
extra-build-variables = { kintsuki = { VERSION = "0.0.0.dev0" }, a816 = { VERSION = "1.1.4.dev0" } }

[tool.ruff]
line-length = 120
# build.py predates the current a816 API; left as is until the patch build is rewritten.
extend-exclude = ["build.py"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["tools", "tests"]

# kintsuki ships no py.typed yet (its vendored pixelmatch isn't mypy-clean).
[[tool.mypy.overrides]]
module = ["kintsuki", "kintsuki.*"]
ignore_missing_imports = true
