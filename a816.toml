rom_size = 0x800000  # 6 MB S-DD1 cart expanded to 8 MB: pages 6-7 hold the patch's data
board = "SHVC-LN3B-01"
entrypoint = "star_ocean.s"
module-paths = ["src"]
include-paths = ["src", "build/gen"]
# Not linted: the tracked generated renders (tools/renders.py).
exclude = ["src_assets/renders"]

[defines]
BATTLE_SPEEDUPS = 1  # src/engine/battle_speed.s: faster battle loop routines (notes/engine/battle_timing.md)
CEL_DMA_ANYTIME = 1  # src/engine/cel_dma.s: no H-blank wait before cel DMAs; may crash CPU rev 1 consoles
AUDIO_DEFERRED = 0  # src/engine/audio_defer.s: battle audio sent from the main loop's wait, not the IRQ
NAME_INDEX = 1  # src/engine/name_index.s: names found by id through a run table, not a scan

# ROM pages 6-7 (physical 0x600000-0x7FFFFF) have no fixed bus address: code reads them through the E window
# with $4806 set to 6 or 7. The patch addresses them as pseudo-banks $40-$5F (sram_text.s translates).
[map.1]
address = "40-5f:0000-ffff"
base = 0x600000
